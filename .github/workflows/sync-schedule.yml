name: Sync Event Data

on:
  schedule:
    - cron: "0 5 * * 4" # Every Thursday at 5:00 AM UTC
  workflow_dispatch:

jobs:
  sync-event:
    name: Update Website Events
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies 📦
        run: npm install

      - name: Sync services
        run: npx tsx scripts/sync-events.ts
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
          VITE_DEPLOYMENT_ID: ${{ secrets.VITE_DEPLOYMENT_ID }}

      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "Chore: Update Event Data"
          add: "src/data/*.json"
          committer_name: "GitHub Actions"
          committer_email: "actions@github.com"
          pull: "--rebase --autostash"

      # A GITHUB_TOKEN-authored push doesn't fire other workflows' `push`
      # triggers, so update-website.yml wouldn't otherwise deploy this change.
      - name: Trigger deployment
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-website.yml --ref ${{ github.ref_name }}
